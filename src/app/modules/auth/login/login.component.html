<div class="header">
  <img nz-image
    nzSrc="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyNyoxmuV_vbHXdVeZGhxEOgcOCGDBmMa1EtxtymBGgw&s=10"
    alt="" />

  <div class="main-content">
    <h3>Welcome to lorem...!</h3>
    <div class="sidebar">
      <button class="nzLogin" (click)="login()">Login</button>
      <button class="nzRegister" (click)="register()">Register</button>
    </div>
    <p style="margin-top: 20px;">Welcome to Lorem ipsum, dolor sit amet consectetur adipisicing elit. Officia obcaecati
      deleniti
      consequatur
      optio delectus, at culpa eum nobis. Doloremque, fuga velit sapiente expedita dolorum quo quidem perspiciatis
      voluptatem nobis quasi?
    </p>

    <form [formGroup]="loginForm" class="login-form" (ngSubmit)="handleSubmit()" nz-form nzLayout="vertical">
      <nz-form-item>
        <nz-form-label>
          <span style="font-weight: bold;margin-top: 20px;">User Name</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Username là bắt buộc">
          <input nz-input formControlName="userName" placeholder="Enter your User name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>
          <span style="font-weight: bold;">Password</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Password là bắt buộc">
          <nz-input-group class="input-password" [nzSuffix]="passwordSuffix">
            <input nz-input [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Password" />
          </nz-input-group>
          <ng-template #passwordSuffix>
            <nz-icon class="nzIcon" [nzType]="showPassword ? 'eye-invisible' : 'eye'"
              (click)="showPassword = !showPassword" />
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <div nz-row class="login-form-margin">
        <div>
          <label nz-checkbox formControlName="remember">
            <span>Remember me</span>
          </label>
        </div>
        <div>
          <a class="login-form-forgot">Forgot password?</a>
        </div>
      </div>
      <div class="main-btn">
        <button class="btn-login" nz-button>Login</button>
      </div>
    </form>
  </div>
</div>
