<span class="course-title">QUẢN LÝ KHÓA HỌC</span>

<div style="display: flex;gap: 10px;margin-top: 20px;margin-left: 20px;">
  <input nz-input [(ngModel)]="filterSearch" (keyup.enter)="handleFiterSearch()" placeholder="Tìm kiếm dữ liệu" />
  <button nz-button nzType="primary" (click)="openModalCourse()">Tạo khóa học</button>
</div>
<app-data-table class="header-course" [data]="listOfCourse" [columns]="tableColumn" [scrollX]="'1000px'" [scrollY]="'450px'"
  (rowClick)="handleRowClick($event)"></app-data-table>


<div class="pagination-course">
  <div>
    Tổng số : <span style="font-weight: bold;font-size: 16px;"> {{total}} </span> bản ghi
  </div>
  <div class="pagination-course">
    <div style="display: flex;align-items: center; gap: 10px">
      <span>Hiển thị</span>
      <nz-select class="select-pagination" [(ngModel)]="pageSize" (ngModelChange)="pageSizeChange($event)"
        [nzOptions]="handlePageSize" />
    </div>
    <nz-pagination [nzPageIndex]="page" [nzPageSize]="pageSize" [nzTotal]="total"
      (nzPageIndexChange)="pageChange($event)" (nzPageSizeChange)="pageSizeChange($event)" />
  </div>
</div>


<nz-modal [(nzVisible)]="isCourse" [nzTitle]="modalTitleCourse" [nzFooter]="null" nzWidth="800px"
  class="ant-modal-content" (nzOnCancel)="cancelModalCourse()">
  <ng-container *nzModalContent>
    <form [formGroup]="form" nz-form nzLayout="vertical">
      <div nz-row [nzGutter]="[24, 8]">
        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Mã khóa học</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="courseCode" placeholder="Nhập mã khóa học" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Tên khóa học</nz-form-label>
            <nz-form-control nzErrorTip="Tên khóa học là bắt buộc">
              <input nz-input formControlName="courseName" placeholder="Nhập tên khóa học" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Danh mục</nz-form-label>

            <nz-form-control>
              <input nz-input formControlName="category" placeholder="Frontend / Backend / Database" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Mã giáo viên</nz-form-label>

            <nz-form-control>
              <input nz-input formControlName="teacherId" placeholder="Nhập mã giáo viên" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Giáo viên</nz-form-label>

            <nz-form-control nzErrorTip="Tên giáo viên là bắt buộc">
              <input nz-input formControlName="teacherName" placeholder="Nhập tên giáo viên" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Số buổi / giờ học</nz-form-label>

            <nz-form-control nzErrorTip="Số buổi giờ học là bắt buộc">
              <input nz-input formControlName="duration" placeholder="VD: 30 buổi" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Số học viên tối đa</nz-form-label>
            <nz-form-control nzErrorTip="Số học viên là bắt buộc">
              <input nz-input formControlName="maxStudents" placeholder="Nhập số lượng" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Học phí</nz-form-label>

            <nz-form-control>
              <input nz-input formControlName="price" placeholder="Nhập học phí" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Ngày bắt đầu</nz-form-label>
            <nz-form-control>
              <nz-date-picker class="w-100" formControlName="startDate" nzFormat="dd-MM-yyyy"
                nzPlaceHolder="Chọn ngày bắt đầu">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Ngày kết thúc</nz-form-label>
            <nz-form-control>
              <nz-date-picker class="w-100" formControlName="endDate" nzFormat="dd-MM-yyyy"
                nzPlaceHolder="Chọn ngày kết thúc">
              </nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label>Trạng thái</nz-form-label>
            <nz-form-control>
              <nz-select class="w-100" formControlName="status" nzPlaceHolder="Chọn trạng thái">
                <nz-option [nzValue]="true" nzLabel="true">
                </nz-option>
                <nz-option [nzValue]="false" nzLabel="false">
                </nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div class="form-actions" *ngIf="status !== 'DETAIL'">
        <button nz-button type="button" (click)="cancelModalCourse()">
          Hủy
        </button>
        <button nz-button nzType="primary" type="button" (click)="handleSubmit()">
          {{ status === 'CREATE' ? 'Lưu' : 'Cập nhật' }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>
