<div class="header-table">
  <span style="color: #0c7eed; font-weight: 600; font-size: 20px ;margin-left: 20px;">QUẢN LÝ CHỨC NĂNG HỆ THỐNG</span>
  <div style="
    display: flex;
    justify-content: center;
    text-align: center;
    gap: 20px;
    margin-left: 20px;
    margin-top: 20px;
    ">
    <input type="text" nz-input placeholder="Tìm kiếm dữ liệu..." [(ngModel)]="filterSystem"
      (keyup.enter)="handleClickSearch()" />
    <button nz-button nzType="primary" (click)="openModal()">Tạo mới</button>
  </div>

  <app-data-table style="margin-left: 20px;" [data]="listOfSystem" [columns]="dataTable" (rowClick)="handleRowClick($event)"></app-data-table>

  <div class="pagination-header">
    <div style="margin-left: 20px;">
      Tổng số : <span class="header-total">{{total}}</span> bản ghi
    </div>
    <div class="page-pagination">
      <span>Hiển thị</span>
      <nz-select [(ngModel)]="pageSize" (ngModelChange)="pageSizeChange($event)" [nzOptions]="handleOptionSelect" />
      <nz-pagination [nzPageIndex]="page" [nzPageSize]="pageSize" [nzTotal]="total"
        (nzPageIndexChange)="pageChange($event)" (nzPageSizeChange)="pageSizeChange($event)" />
    </div>
  </div>
</div>


<nz-modal [(nzVisible)]="isSystem" [nzFooter]="null" (nzOnCancel)="closeModal()" nzWidth="700px"
  [nzTitle]="modalTitleRoom">
  <ng-container *nzModalContent>
    <form [formGroup]="form" nz-form nzLayout="vertical">
      <nz-form-item>
        <nz-form-label>
          <span>Mã chức năng</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Mã chức năng là bắt buộc">
          <input nz-input formControlName="functionCode">
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>
          <span>Tên chức năng</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Tên chức năng là bắt buộc">
          <input nz-input formControlName="functionName">
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>
          <span>Danh mục/menu chứa chức năng</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Danh mục/menu chứa chức nănglà bắt buộc">
          <input nz-input formControlName="directoryId">
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>
          <span>Loại chức năng</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Loại chức năng là bắt buộc">
          <input nz-input formControlName="functionType">
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>
          <span>Đường dẫn chức năng</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Đường dẫn chức năng là bắt buộc">
          <input nz-input formControlName="functionUrl">
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>
          <span>Mô tả chức năng</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Đường dẫn chức năng là bắt buộc">
          <input nz-input formControlName="description">
        </nz-form-control>
      </nz-form-item>


      <nz-form-item>
        <nz-form-label>
          <span>Thứ tự hiển thị</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Thứ tự hiển thị là bắt buộc">
          <input nz-input type="number" formControlName="sortOrder">
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>
          <span>Trạng thái</span>
        </nz-form-label>
        <nz-form-control>
          <nz-select formControlName="status">
            <nz-option [nzValue]="true" nzLabel="true" />
            <nz-option [nzValue]="false" nzLabel="false" />
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <div class="room-footer">
        <button nz-button nzType="primary" type="button" (click)="closeModal()">Hủy</button>
        <button nz-button nzType="primary" type="button" (click)="handleSubmitRoom()">{{status === 'CREATE' ? ('Lưu'):
          ('Cập nhật')}}</button>
      </div>
    </form>
  </ng-container>
</nz-modal>
