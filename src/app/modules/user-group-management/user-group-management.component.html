<span class="color-span">QUẢN LÝ NGƯỜI DÙNG</span>
<div style="
    display: flex;
    justify-content: center;
    text-align: center;
    gap: 20px;
    margin-left: 20px;
  ">
    <input nz-input placeholder="Tìm kiếm dữ liệu" [(ngModel)]="filterSearch" />
    <button nz-button nzType="primary" (click)="openModal()">Tạo mới</button>
</div>

<nz-table #basicTable [nzData]="listOfUsers" [nzFrontPagination]="true" [nzBordered]="true" class="table-header">
    <thead>
        <tr>
            <th>Mã nhóm</th>
            <th>Tên nhóm</th>
            <th>Mô tả</th>
            <th>Trạng thái</th>
            <th>Mã người dùng</th>
            <th>Mã quyền</th>
            <th>Hành đồng</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let user of listOfUsers">
            <td>{{ user.groupCode }}</td>
            <td>{{ user.groupName }}</td>
            <td>{{ user.description }}</td>
            <td>{{ user.status }}</td>
            <td>{{ user.userIds }}</td>
            <td>{{ user.permissionIds }}</td>
            <td style="display: flex; justify-content: center;text-align: center ;gap: 10px;">
                <button nz-button nzType="primary" (click)="userEdit(user)">
                    <span nz-icon nzType="edit" nzTheme="outline"></span>
                </button>
                <button nz-button nzType="primary" (click)="userDelete(user)">
                    <span nz-icon nzType="delete" nzTheme="outline"></span>
                </button>
            </td>
        </tr>
    </tbody>
</nz-table>


<nz-modal [(nzVisible)]="isUsers" [nzFooter]="null" [nzTitle]="modalTitle" [nzWidth]="650" (nzOnCancel)="closeModal()">
    <ng-container *nzModalContent>
        <form [formGroup]="form" nz-form nzLayout="vertical" (ngSubmit)="handleSubmit()">
            <div class="form-grid">
                <nz-form-item>
                    <nz-form-label nzRequired>Mã nhóm</nz-form-label>
                    <nz-form-control nzErrorTip="Vui lòng nhập mã nhóm">
                        <input nz-input formControlName="groupCode" placeholder="Nhập mã nhóm..." />
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item>
                    <nz-form-label nzRequired>Tên nhóm</nz-form-label>
                    <nz-form-control nzErrorTip="Vui lòng nhập tên nhóm">
                        <input nz-input formControlName="groupName" placeholder="Nhập tên nhóm..." />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item class="full-width">
                    <nz-form-label>Mô tả</nz-form-label>
                    <nz-form-control>
                        <textarea nz-input formControlName="description" placeholder="Nhập mô tả nhóm người dùng..."
                            [nzAutosize]="{ minRows: 3, maxRows: 5 }"></textarea>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label nzRequired>Trạng thái</nz-form-label>
                    <nz-form-control>
                        <nz-select class="custom-select" formControlName="status" nzPlaceHolder="Nhập trạng thái...">
                            <nz-option nzValue="true" nzLabel="Hoạt động"></nz-option>
                            <nz-option nzValue="false" nzLabel="Ngừng hoạt động"></nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-label>Người dùng thuộc nhóm</nz-form-label>
                    <nz-form-control>
                        <nz-select class="custom-select" formControlName="userIds" nzMode="multiple" nzPlaceHolder="Chọn người dùng..."
                            nzAllowClear>
                            <!-- Thay bằng danh sách người dùng lấy từ API -->
                            <nz-option *ngFor="let user of listOfUsers" [nzValue]="user.id"
                                [nzLabel]="user.groupName"></nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item class="full-width">
                    <nz-form-label>Quyền được cấp</nz-form-label>
                    <nz-form-control>
                        <nz-select class="custom-select" formControlName="permissionIds" nzMode="multiple"
                            nzPlaceHolder="Chọn quyền cho nhóm..." nzAllowClear>
                            <!-- Thay bằng danh sách quyền lấy từ API -->
                            <nz-option *ngFor="let permission of listOfPermissions" [nzValue]="permission.id"
                                [nzLabel]="permission.permissionName"></nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>
            </div>

            <div class="modal-actions">
                <button nz-button nzType="default" type="button" (click)="closeModal()">
                    Hủy
                </button>
                <button nz-button nzType="primary" type="submit" [disabled]="form.invalid">
                    {{ status === 'CREATE' ? 'Lưu' : 'Cập nhật' }}
                </button>
            </div>
        </form>
    </ng-container>
</nz-modal>
