<span class="color-span">QUẢN LÝ NGƯỜI DÙNG</span>
<div style="
    display: flex;
    justify-content: center;
    text-align: center;
    gap: 20px;
    margin-left: 20px;
  ">
  <input nz-input placeholder="Tìm kiếm dữ liệu" [(ngModel)]="filterSearch" (keyup.enter)="search()" />
  <button nz-button nzType="primary" (click)="openModal()">Tạo mới</button>
</div>
<app-data-table style="margin-left: 20px;" [data]="listOfUsers" [columns]="dataTable"
  (rowClick)="handleRowClick($event)"></app-data-table>
<!-- <app-paging [page]="page" [pageSize]="pageSize" [total]="total" (pageChange)="pageChange($event)"
  (pageSizeChange)="pageSizeChange($event)"></app-paging> -->

<div class="class-pagination">
  <div style="margin-left: 20px">
    Tổng số : <span style="font-weight: 600">{{ total }}</span> bản ghi
  </div>
  <div class="pagination-header">
    <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      ">
      <span>Hiển thị</span>
      <nz-select [(ngModel)]="pageSize" (ngModelChange)="pageSizeChange($event)" [nzOptions]="handleOptions" />
    </div>
    <nz-pagination [nzPageIndex]="page" [nzPageSize]="pageSize" [nzTotal]="total"
      (nzPageIndexChange)="pageChange($event)" (nzPageSizeChange)="pageSizeChange($event)" />
  </div>
</div>

<nz-modal [(nzVisible)]="isUsers" [nzFooter]="null" [nzTitle]="modalTitle" [nzWidth]="750" (nzOnCancel)="closeModal()">
  <ng-container *nzModalContent>
    <form [formGroup]="form" nz-form nzLayout="vertical">
      <div class="form-grid">
        <nz-form-item>
          <nz-form-label nzRequired>
            <span>Mã nhóm</span>
          </nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập mã nhóm">
            <input nz-input formControlName="groupCode" placeholder="Nhập mã nhóm..." />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>
            <span>Tên nhóm</span>
          </nz-form-label>
          <nz-form-control nzErrorTip="Vui lòng nhập tên nhóm">
            <input nz-input formControlName="groupName" placeholder="Nhập tên nhóm..." />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="full-width">
          <nz-form-label>
            <span>Mô tả</span>
          </nz-form-label>
          <nz-form-control>
            <textarea nz-input formControlName="description" placeholder="Nhập mô tả nhóm người dùng..."
              [nzAutosize]="{ minRows: 3, maxRows: 5 }"></textarea>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>
            <span>Trạng thái</span>
          </nz-form-label>
          <nz-form-control>
            <nz-select class="custom-select" formControlName="status" nzPlaceHolder="Nhập trạng thái...">
              <nz-option nzValue="true" nzLabel="true"></nz-option>
              <nz-option nzValue="false" nzLabel="false"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>
            <span>Người dùng thuộc nhóm</span>
          </nz-form-label>
          <nz-form-control>
            <nz-select class="custom-select" formControlName="userIds" nzMode="multiple"
              nzPlaceHolder="Chọn người dùng..." nzAllowClear>
              <nz-option *ngFor="let group of listOfGroupnames" [nzValue]="group.id"
                [nzLabel]="group.groupName"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="full-width">
          <nz-form-label>
            <span>Quyền được cấp</span>
          </nz-form-label>
          <nz-form-control>
            <nz-select class="custom-select" formControlName="permissionIds" nzMode="multiple"
              nzPlaceHolder="Chọn quyền cho nhóm..." nzAllowClear>
              <nz-option *ngFor="let permission of listOfPermissions" [nzValue]="permission.id"
                [nzLabel]="permission.permissionName"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="modal-actions">
        <button nz-button nzType="default" type="button" (click)="closeModal()">
          Hủy
        </button>
        <button nz-button nzType="primary" (click)="handleSubmit()">
          <!-- /* [disabled]="form.invalid" */ -->
          {{ status === "CREATE" ? "Lưu" : "Cập nhật" }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>
