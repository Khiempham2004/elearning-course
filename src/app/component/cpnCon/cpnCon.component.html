<span class="header-title">QUẢN LÝ DANH MỤC CẤP TỈNH</span>
<div style="
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 20px;
  ">
  <input nz-input placeholder="Nhập mã hoặc tên tỉnh..." [(ngModel)]="filterSearch" (ngModelChange)="handleSearch()" />
  <button nz-button nzType="primary" (click)="createNewProvince()">
    Tạo mới cấp tỉnh
  </button>
</div>

<app-data-table style="margin-top: 20px" [data]="province" [columns]="listOfProvince" [bordered]="true"
  (rowClick)="handleRowClick($event)" (actionClick)="handleActionClick($any($event))">
</app-data-table>

<app-paging [page]="page" [pageSize]="pageSize" [total]="total" (pageSizeChange)="pageSizeChange($event)"
  (pageChange)="pageChange($event)"></app-paging>

<nz-modal [(nzVisible)]="isProvince" nzWidth="650px" [nzTitle]="modalTitle" (nzOnCancel)="handleCancel()"
  [nzFooter]="null" class="ant-modal-content">
  <ng-container *nzModalContent>
    <form [formGroup]="form" (ngSubmit)="handleSubmit()" nz-form nzLayout="vertical" class="province-form">
      <nz-form-item>
        <nz-form-label>
          <span style="font-weight: bold; font-size: 15px">Mã tỉnh</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Mã tỉnh không được để trống">
          <input nz-input formControlName="provinceCode" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>
          <span style="font-weight: bold; font-size: 15px">Tên tỉnh</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Tên tỉnh không được để trống">
          <input nz-input formControlName="provinceName" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>
          <span style="font-weight: bold; font-size: 15px">Loại đơn vị</span>
        </nz-form-label>
        <nz-form-control nzErrorTip="Loại đơn vị không được để trống">
          <input nz-input formControlName="provinceType" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>
          <span style="font-weight: bold; font-size: 15px">Trạng thái</span>
        </nz-form-label>
        <nz-form-control>
          <nz-select formControlName="status">
            <nz-option [nzValue]="true" nzLabel="true"></nz-option>
            <nz-option [nzValue]="false" nzLabel="false"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>
      <div style="display: flex; justify-content: end; gap: 10px" *ngIf="status !== 'DETAIL'">
        <button nz-button type="button" (click)="handleCancel()">Hủy</button>
        <button nz-button nzType="primary" type="submit">
          {{ status === "CREATE" ? "Lưu" : "Cập nhật" }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>
